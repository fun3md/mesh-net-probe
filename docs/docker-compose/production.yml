

services:
  admin-web-prod:
    build:
      context: ../..
      dockerfile: Dockerfile.multi-platform
      target: runtime-web
    image: mesh-probe:admin-web-prod
    ports:
      - "80:8080"
      - "443:8443"  # HTTPS (future)
    environment:
      - ADMIN_WEB_PORT=8080
      - ADMIN_WEB_HOST=0.0.0.0
      - ADMIN_WEB_LOG_LEVEL=info
      - GIN_MODE=release
      # Production secrets (set via environment)
      - JWT_SECRET=${JWT_SECRET}
      - DB_PASSWORD=${DB_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - /var/log/admin-web:/app/logs:rw
      - /var/lib/admin-web:/app/data:rw
      - /etc/ssl/certs:/etc/ssl/certs:ro
    networks:
      - mesh-probe-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Production Redis Cluster for session storage
  redis-prod:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
      - ../../docs/docker-compose/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - mesh-probe-prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # PostgreSQL for application data
  postgres-prod:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=adminweb
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ../../docs/docker-compose/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mesh-probe-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d adminweb"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Production monitoring stack
  prometheus-prod:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../../docs/docker-compose/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ../../docs/docker-compose/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-prod-data:/prometheus
    networks:
      - mesh-probe-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  grafana-prod:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=${DOMAIN}
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-prod-data:/var/lib/grafana
      - ../../docs/docker-compose/grafana-prod-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../docs/docker-compose/grafana-prod-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - mesh-probe-prod
    restart: always
    depends_on:
      - prometheus-prod
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Traefik reverse proxy
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../docs/docker-compose/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-ssl:/ssl
    networks:
      - mesh-probe-prod
    restart: always
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--metrics.prometheus=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"

volumes:
  redis-prod-data:
    driver: local
  postgres-prod-data:
    driver: local
  prometheus-prod-data:
    driver: local
  grafana-prod-data:
    driver: local
  traefik-ssl:
    driver: local

networks:
  mesh-probe-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
    driver_opts:
      com.docker.network.bridge.name: mesh-probe-prod