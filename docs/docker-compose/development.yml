version: '3.8'

services:
  admin-web-dev:
    build:
      context: ../..
      dockerfile: Dockerfile.multi-platform
      target: runtime-web
    image: mesh-probe:admin-web-dev
    container_name: admin-web-dev
    ports:
      - "8080:8080"
      - "8081:8081"  # WebSocket port (future)
    environment:
      - ADMIN_WEB_PORT=8080
      - ADMIN_WEB_HOST=0.0.0.0
      - ADMIN_WEB_LOG_LEVEL=debug
      - GIN_MODE=debug
    volumes:
      - ../../docs/example-config:/app/config:ro
      - admin-web-dev-logs:/app/logs
      - admin-web-dev-data:/app/data
    networks:
      - mesh-probe-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-web-dev.rule=Host(`localhost`)"
      - "traefik.http.routers.admin-web-dev.port=8080"
      - "traefik.http.services.admin-web-dev.loadbalancer.server.port=8080"

  # Optional: Redis for session storage and caching
  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=dev-password
      - REDIS_MAXMEMORY=256mb
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
    volumes:
      - redis-dev-data:/data
    networks:
      - mesh-probe-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Jaeger for distributed tracing
  jaeger-dev:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-dev
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "6831:6831/udp"  # UDP collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=50000
    networks:
      - mesh-probe-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Prometheus for metrics collection
  prometheus-dev:
    image: prom/prometheus:latest
    container_name: prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ../../docs/docker-compose/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dev-data:/prometheus
    networks:
      - mesh-probe-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Grafana for metrics visualization
  grafana-dev:
    image: grafana/grafana:latest
    container_name: grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-dev-data:/var/lib/grafana
      - ../../docs/docker-compose/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../docs/docker-compose/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - mesh-probe-dev
    restart: unless-stopped
    depends_on:
      - prometheus-dev

volumes:
  admin-web-dev-logs:
    driver: local
  admin-web-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  prometheus-dev-data:
    driver: local
  grafana-dev-data:
    driver: local

networks:
  mesh-probe-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16